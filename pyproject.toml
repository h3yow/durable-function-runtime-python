[project]
name = "durable-function-runtime-python"
version = "0.1.0"
requires-python = ">=3.14.4"
dependencies = [
    "fastapi[standard]>=0.141.1",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.pytest.ini_options]
# Surface runtime logs (invocation ids, state transitions, retry records)
# directly in the test output.
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(levelname)-7s %(name)s %(message)s"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
